const cards=[{"title": "Minha perspectiva", "q": "Como você enxerga a relação entre IA e experiência do cliente?", "message": "Reduzir esforço e dar às pessoas mais condições de cuidar.", "answer": "Eu olho para IA em CX a partir de duas perguntas: o que fica mais simples para o cliente e o que melhora para quem precisa atendê-lo? A tecnologia pode organizar informação, reduzir tarefas repetitivas e ajudar a executar uma resolução. Mas a experiência também depende de contexto, clareza e responsabilidade. Para mim, o ganho aparece quando o cliente não precisa repetir a história e a pessoa que o atende consegue concentrar atenção no que realmente exige julgamento. É essa combinação que me interessa: capacidade tecnológica com um propósito claro na relação com o cliente.", "example": "Exemplo ilustrativo: a pessoa recebe o histórico resumido antes de assumir o atendimento e confirma com o cliente o que ainda precisa ser resolvido.", "lesson": "Começar pelo atrito da jornada, depois escolher a tecnologia.", "complement": "Além do ganho de produtividade, eu olharia para o esforço que deixou de existir para o cliente.", "prepare": "Escolha uma situação real em que a falta de contexto dificultou uma resolução. Conte só o que puder compartilhar publicamente."}, {"title": "IA a serviço do cliente", "q": "Onde a IA pode contribuir de forma concreta em CX?", "message": "Antecipar, compreender e resolver são possibilidades de valor.", "answer": "Uma forma de organizar essa conversa é pensar em antecipar, compreender e resolver. Uma previsão pode sinalizar uma necessidade; a IA generativa pode ajudar a interpretar uma solicitação; um agente pode executar ações autorizadas. Essas capacidades podem coexistir, e cada uma exige critérios de avaliação. O ponto não é colocar IA em toda etapa. É identificar um problema concreto da jornada e verificar se a solução realmente ajuda. Um atendimento pode parecer muito inteligente e ainda não resolver nada. Eu daria atenção ao que acontece depois da resposta: o pedido foi encaminhado corretamente, a ação foi concluída e o cliente entendeu o próximo passo?", "example": "Exemplo ilustrativo: interpretar um pedido, confirmar a intenção e executar apenas a ação autorizada, com alternativa de atendimento humano.", "lesson": "Avaliar a resolução, não só a qualidade aparente da resposta.", "complement": "Esse exemplo fica ainda mais interessante quando acompanhamos o resultado para o cliente.", "prepare": "Use um exemplo autorizado e diferencie uma possibilidade, algo em desenvolvimento e algo já comprovado."}, {"title": "Regras, IA e pessoas", "q": "Como decidir o que automatizar e onde manter o humano?", "message": "Os papéis se complementam; autonomia não é o destino de todo processo.", "answer": "Eu não trataria regras, IA e pessoas como degraus em que um substitui o outro. Quando precisamos de uma execução previsível, uma regra pode ser a melhor escolha. Quando há linguagem e contexto para interpretar, a IA pode ajudar. E, quando aparece uma exceção com consequências importantes, precisamos de julgamento e autoridade para decidir. A questão é combinar essas capacidades. Também precisamos lembrar que automatizar um processo conhecido é diferente de automatizar uma interação que ainda temos dificuldade de explicar. Quanto maior a incerteza e o impacto sobre o cliente, mais cuidado eu teria com os limites e com a possibilidade de intervenção.", "example": "Exemplo ilustrativo: uma regra verifica uma condição objetiva; a IA organiza a solicitação; uma pessoa avalia uma exceção que depende de contexto.", "lesson": "Escolher a capacidade adequada para cada decisão.", "complement": "Concordo com ampliar a capacidade de execução; acrescentaria que nem toda decisão precisa do mesmo nível de autonomia.", "prepare": "Lembre uma decisão de escopo que você possa explicar sem revelar sistemas, arquitetura ou mecanismos internos."}, {"title": "Ganhos percebidos", "q": "Como saber se a automação melhorou a experiência?", "message": "Eficiência precisa aparecer como menos esforço e mais resolução.", "answer": "Velocidade, escala e custo são critérios importantes para a empresa. Mas eu os colocaria ao lado de perguntas sobre o cliente. Ele precisou repetir informações? Entendeu o próximo passo? Conseguiu resolver ou teve de procurar outro canal? Se reduzimos o tempo de uma conversa, mas criamos uma nova tentativa de contato, talvez só tenhamos deslocado o trabalho. Eu buscaria uma visão conjunta de produtividade e experiência, acompanhando a jornada depois da interação. O mesmo vale para conversão: uma venda pode acontecer e ainda deixar uma expectativa equivocada. Por isso, o resultado imediato precisa ser observado junto com a qualidade da relação que fica.", "example": "Exemplo ilustrativo: um atendimento mais curto que gera recontato não deve ser considerado melhor apenas pela duração.", "lesson": "Combinar eficiência com sinais de resolução e esforço.", "complement": "Eu acrescentaria uma medida do que acontece depois dessa interação.", "prepare": "Se trouxer números, use somente métricas verificadas, com período e contexto. Sem números, explique o critério de avaliação."}, {"title": "Confiança na interação", "q": "O cliente deveria saber quando fala com IA?", "message": "Transparência, coerência e continuidade ajudam a construir confiança.", "answer": "Minha posição é favorável à transparência. O cliente precisa entender a interação e ter clareza sobre o que pode esperar. Mas eu não resumiria confiança ao aviso de que existe IA. Também importa se as informações são coerentes, se os limites estão claros e se existe continuidade quando o atendimento precisa mudar de mãos. Uma interface pode parecer muito humana e ainda produzir uma experiência impessoal, especialmente quando ignora o contexto. Eu prefiro pensar em uma conexão construída por ações: compreender o pedido, não prometer o que não pode cumprir e manter a responsabilidade até a resolução. A tecnologia pode apoiar tudo isso sem precisar simular uma relação que não consegue sustentar.", "example": "Exemplo ilustrativo: identificar o atendimento automatizado, explicar seus limites e transferir o contexto quando uma pessoa assume.", "lesson": "Não confundir parecer humano com cuidar da relação.", "complement": "A conveniência ajuda, mas a confiança também depende do que acontece quando o cliente precisa de algo fora do padrão.", "prepare": "A formulação sobre transparência é uma posição sugerida para sua fala, não uma declaração de política corporativa."}, {"title": "Presença humana útil", "q": "Onde o humano continua fazendo diferença?", "message": "A pessoa precisa de contexto e autoridade para ajudar.", "answer": "Eu vejo o papel humano com muita clareza quando precisamos acolher uma frustração, interpretar uma exceção, negociar uma solução ou assumir responsabilidade. Isso não significa que a tecnologia fique de fora. Ela pode organizar o histórico, ajudar a entender o caso e reduzir o trabalho operacional. Mas colocar uma pessoa no fluxo não resolve automaticamente o problema. Se ela recebe o cliente sem contexto ou não tem autonomia para ajudar, o atendimento continua travado. A participação humana precisa ser desenhada para funcionar: informação disponível, responsabilidade clara e condições de agir. Para mim, esse é um uso valioso da IA: liberar atenção para que as pessoas consigam cuidar melhor dessas situações.", "example": "Exemplo ilustrativo: em uma transferência, a pessoa recebe o histórico e confirma o problema, sem pedir que o cliente comece do zero.", "lesson": "Presença humana deve vir acompanhada de condições reais de atuação.", "complement": "Eu olharia também para a experiência do colaborador que precisa assumir essa situação.", "prepare": "Escolha uma vivência de operação que mostre a diferença entre encaminhar um caso e permitir que alguém o resolva."}, {"title": "Quando algo dá errado", "q": "Como preservar a confiança depois de uma falha?", "message": "Reconhecer, assumir, corrigir e acompanhar.", "answer": "Quando algo dá errado, o cliente precisa de uma resposta que faça a situação avançar. Eu organizaria isso em quatro movimentos: reconhecer o problema, assumir a responsabilidade pelo atendimento, corrigir e acompanhar. Internamente, vamos precisar entender se a falha veio do modelo, do processo ou de uma integração. Mas o cliente não deveria ter de investigar essa cadeia nem reiniciar a história a cada transferência. Também precisamos definir quem pode interromper uma atuação inadequada e quem tem condições de resolver a consequência. A confiança não depende de prometer ausência total de erros. Depende também de como a empresa age quando percebe que precisa corrigir o caminho.", "example": "Exemplo ilustrativo: diante de uma orientação incorreta, corrigir a informação, indicar quem acompanha o caso e confirmar a resolução.", "lesson": "Projetar a recuperação junto com o funcionamento normal.", "complement": "Além de prevenir a falha, eu desenharia o que acontece com o cliente quando ela ocorre.", "prepare": "Evite expor incidentes ou informações internas. Um cenário ilustrativo basta para explicar essa prática."}, {"title": "Delegar com critério", "q": "Que boa prática você destacaria para quem está implementando agentes?", "message": "Definir limites, avaliar o efeito e preservar intervenção.", "answer": "Eu destacaria três critérios: definir o que o agente pode fazer, avaliar o efeito sobre o cliente e preservar a possibilidade de intervenção. Na Ituran, estamos trabalhando com agentes próprios, e aprendizagem, governança e validação humana são preocupações importantes nesse desenvolvimento. Eu manteria essa conversa no nível das escolhas: que tipo de atuação é aceitável, como percebemos se a experiência melhorou e quem pode assumir quando necessário. Uma demonstração ajuda a visualizar uma possibilidade, mas operar envolve clientes e consequências ao longo do tempo. Por isso, minha proposta é que o nível de autonomia acompanhe o impacto da decisão e a evidência que temos sobre seu funcionamento.", "example": "Exemplo a preparar: escolha uma decisão real de escopo ou supervisão que possa ser compartilhada. Conte o problema, o critério adotado e o aprendizado, sem detalhes internos.", "lesson": "Autonomia proporcional ao impacto e à evidência disponível.", "complement": "Esse potencial precisa vir acompanhado de critérios para decidir quando ampliar a atuação.", "prepare": "O briefing confirma trabalho em desenvolvimento, não resultados de produção. Não apresentar esta fala como evidência de ganho já medido."}, {"title": "Síntese da minha contribuição", "q": "Que mensagem você gostaria de deixar?", "message": "Menos esforço para o cliente; mais condições para as pessoas cuidarem.", "answer": "A mensagem que eu gostaria de deixar é que a capacidade da IA abre possibilidades, mas o propósito precisa orientar a aplicação. Para mim, uma boa escolha reduz o esforço do cliente e dá às pessoas mais condições de resolver o que exige contexto, julgamento e cuidado. Isso pede atenção ao resultado, aos limites e à continuidade da experiência. Não basta uma resposta impressionante se o problema continua com o cliente. Por isso, gosto dessa pergunta: além de pensar no que a IA consegue fazer, o que queremos que ela faça pela relação que estamos construindo? É esse critério que eu levaria para as decisões de implementação.", "example": "Retome um exemplo que você já tenha contado na conversa, sem abrir um assunto novo.", "lesson": "Propósito, método e responsabilidade orientam o uso.", "complement": "Essa é a perspectiva que eu acrescentaria às experiências compartilhadas aqui.", "prepare": "Use quando o mediador pedir sua síntese. Conclua sua contribuição e devolva a palavra, sem encerrar o painel."}];


/* app.js */
(()=>{const $=id=>document.getElementById(id);let saved={};try{saved=JSON.parse(localStorage.getItem('cx-panelist-v1')||'{}')}catch{}let index=Math.max(0,Math.min(8,saved.index||0)),scale=saved.scale||1,elapsed=saved.elapsed||0,started=saved.started||null;function persist(){try{localStorage.setItem('cx-panelist-v1',JSON.stringify({index,scale,elapsed,started}))}catch{}}function total(){return elapsed+(started?Date.now()-started:0)}function markup(c){return `<div class="meta">PAINELISTA · FICHA ${cards.indexOf(c)+1} · RESPOSTA SUGERIDA DE 60–90 S</div><h1>${c.title}</h1><div class="prompt"><label>Pergunta provável</label><p>${c.q}</p></div><h2>${c.message}</h2><div class="grid"><div><label>Exemplo / experiência</label><p>${c.example}</p></div><div><label>Aprendizado</label><p>${c.lesson}</p></div><div class="wide"><label>Para complementar uma fala</label><p>${c.complement}</p></div></div><details><summary>Fala sugerida · 60–90 segundos</summary><p>${c.answer}</p></details><details><summary>Preparação pessoal</summary><p>${c.prepare}</p></details>`}function show(n){index=Math.max(0,Math.min(cards.length-1,n));$('card').innerHTML=markup(cards[index]);$('card').scrollTop=0;$('prev').disabled=index===0;$('next').disabled=index===8;document.documentElement.style.setProperty('--scale',scale);persist();tick()}function tick(){let s=Math.floor(total()/1000);$('timer').textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');$('toggle').textContent=started?'Pausar':'Iniciar';$('position').textContent=`${index+1}/9 · ${s<60?'Minha fala':s<90?'60 s · concluir ideia':'90 s · sintetizar'}`}$('toggle').onclick=()=>{if(started){elapsed=total();started=null}else started=Date.now();persist();tick()};$('reset').onclick=()=>{if(confirm('Zerar e pausar o cronômetro?')){elapsed=0;started=null;persist();tick()}};$('prev').onclick=()=>show(index-1);$('next').onclick=()=>show(index+1);$('minus').onclick=()=>{scale=Math.max(.8,scale-.1);show(index)};$('plus').onclick=()=>{scale=Math.min(1.6,scale+.1);show(index)};$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{alert('No iPhone, abra no Safari e use Compartilhar → Adicionar à Tela de Início.')}};document.addEventListener('keydown',e=>{if(['BUTTON','SELECT','SUMMARY'].includes(e.target.tagName))return;if(['ArrowRight','PageDown',' ','ArrowLeft','PageUp'].includes(e.key))e.preventDefault();if(['ArrowRight','PageDown',' '].includes(e.key))show(index+1);if(['ArrowLeft','PageUp'].includes(e.key))show(index-1);if(e.key.toLowerCase()==='f')$('fullscreen').click()});let start;const main=$('card');main.addEventListener('pointerdown',e=>{if(e.target.closest('details'))return;start={x:e.clientX,y:e.clientY}});main.addEventListener('pointerup',e=>{if(e.target.closest('details')){start=null;return}if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)show(index+(dx<0?1:-1));else if(Math.abs(dx)<10&&Math.abs(dy)<10){if(e.clientX<30)show(index-1);if(e.clientX>innerWidth-30)show(index+1)}start=null});main.addEventListener('pointercancel',()=>start=null);setInterval(tick,250);show(index);if('serviceWorker'in navigator&&location.protocol!=='file:'){let refreshing=false;const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});}window.addEventListener('beforeprint',()=>{main.innerHTML=cards.map(c=>`<section class="print-card">${markup(c)}</section>`).join('');main.querySelectorAll('details').forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>show(index))})();

</script></body></html>
